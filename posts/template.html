<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f1732; --navy2:#1e2d50; --gold:#ffd700; --white:#f5f3f0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; }
  body {
    font-family:'Poppins', sans-serif; color:var(--white);
    background:linear-gradient(150deg, var(--navy) 0%, var(--navy2) 100%);
    position:relative; overflow:hidden; padding:90px 90px 80px;
    display:flex; flex-direction:column;
  }
  body::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 85% 12%, rgba(255,215,0,.13) 0%, transparent 42%); }
  .top { display:flex; justify-content:space-between; align-items:center; position:relative; }
  .tag { font-size:22px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); font-weight:500; }
  .num { font-family:'Playfair Display',serif; font-size:30px; color:var(--gold); opacity:.55; }
  .rule { width:90px; height:5px; background:var(--gold); margin:48px 0 40px; position:relative; }
  h1 { font-family:'Playfair Display',serif; font-size:68px; line-height:1.12; font-weight:700; position:relative; }
  h1 em { color:var(--gold); font-style:italic; }
  .lead { font-size:28px; line-height:1.55; font-weight:300; margin-top:34px; color:rgba(245,243,240,.88); position:relative; }
  .items { margin-top:48px; display:flex; flex-direction:column; gap:26px; position:relative; }
  .item { display:flex; gap:26px; align-items:flex-start; background:rgba(255,255,255,.05);
    border-left:4px solid var(--gold); padding:24px 28px; border-radius:6px; }
  .item b { font-family:'Playfair Display',serif; font-size:40px; color:var(--gold); line-height:1; min-width:44px; }
  .item h3 { font-size:28px; font-weight:600; margin-bottom:4px; }
  .item p { font-size:22px; font-weight:300; line-height:1.45; color:rgba(245,243,240,.8); }
  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; position:relative;
    border-top:1px solid rgba(255,215,0,.3); padding-top:28px; }
  .brand { font-family:'Playfair Display',serif; font-size:30px; }
  .brand span { display:block; font-family:'Poppins',sans-serif; font-size:19px; font-weight:300; opacity:.75; margin-top:2px; }
  .cta { font-size:20px; color:var(--gold); text-align:right; max-width:560px; }
</style>
</head>
<body>
  <div class="top"><div class="tag" id="tag"></div><div class="num" id="num"></div></div>
  <div class="rule"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="brand">LM Consultoria<span>Ewander Ferreira de Macedo</span></div>
    <div class="cta" id="cta"></div>
  </div>
<script>
  const p = window.POST;
  document.getElementById('tag').textContent = p.tag;
  document.getElementById('num').textContent = p.num;
  document.getElementById('title').innerHTML = p.title;
  document.getElementById('lead').textContent = p.lead;
  document.getElementById('cta').textContent = p.cta;
  document.getElementById('items').innerHTML = p.items.map((it, i) =>
    `<div class="item"><b>${i+1}</b><div><h3>${it.h}</h3><p>${it.p}</p></div></div>`).join('');
</script>
</body>
</html>
